  語言鎖定版（字數報價-中文/日文/英文/韓文）v1.3.0 (2026-09-24)
  v1.3.0：報價區新增「複製報價交接碼」（Ken 指示）——給「報價製作表」Claude 專案填筆譯母檔用。
          交接碼＝可讀摘要＋一行 DATA JSON（逐檔字數/金額/指紋、單價、低消、有效天數、折讓），並直接給出
          報價單填法：數量＝計價字數合計、單價＝本次單價、單行金額＝ROUND(字數×單價)（先到分再四捨五入），
          尾數調整＝小計−單行金額（進位差＋單檔低消，恆 ≥0）。計數與報價邏輯不變（回歸 ±0）。
  v1.2.1：說明面板文字精簡（Ken 指示）；頁尾改「離線計算工具，不上網」。計數邏輯不變。
  v1.2.0：新增韓文版（Ken 指示）——韓文一個字（音節，如 한、국、어）＝1 字，夾雜英數連續串每串 1 字，
          空白不計（＝韓國業界「공백 제외 글자수」）；計法直接沿用中日文 ziCount，引擎零改動。
          語言不符警示加韓文判斷：韓文字母占 CJK >30% 視為韓文檔——中/日/英文版遇韓文檔→韓文版；
          韓文版遇非韓文 CJK 檔→依假名有無判日文/中文版。既有三語檔無韓文字，判斷結果不變（回歸 ±0）。
          說明面板「與 Word 同一算法」改為依語言替換的註記：韓文版註明 Word「字數」以空格分詞、不適用韓文。
  v1.1.1：規則面板濃縮（Ken 指示「只留付費者在意的」）——標題「📖 計數與報價規則（…）」→「📖 說明」、
          頂欄捷徑同步改「說明」；11 條收斂為 6 條（保留：計法、不收內容、與 Word 差異、圖片另計、
          範圍與折讓、低消與版本鎖定；刪除：計入清單枚舉、30K 技術上限、語言版本說明——後者由
          語言不符警示連結取代）。LINE 報價單文字與計數邏輯不變。
  v1.1.0：檔案卡右上加「✕」移除鍵（同步移出報價、釋放縮圖記憶體；全部移除時收合報價區；
          分析中/錯誤/重複卡同樣可移除）；語言不符警示改附正確版本連結（同資料夾兄弟檔、另開分頁）——
          中日文版遇非 CJK 檔→英文版；英文版遇 CJK 檔以假名有無判日文/中文版；中文版遇假名占比
          >5% 檔提示改用日文版。日文版遇純漢字檔不提示（名詞清單類日文檔也可能零假名，誤報風險高，
          且中日版計法相同、數字不受影響）。計數邏輯不變（回歸 ±0）。
  v1.0.0：語言鎖定三版起點（引擎＝wordcount-quote v2.0.1 混合計法）。
  ────────────────────────────────
  wordcount-quote v2.0.0 (2026-08-17)
  v2.0.1：三份日文合約校準（Word 標準答案 1494/458/346）——1494 與 458 正文 ±0 全中；DOCX 頁首/頁尾改預設
          不入報價（Word 字數統計不含，多為頁碼/模板出處；可勾回）；346 檔 +9 經逐碼位庫存代數證明無一致
          規則可解（該檔獨有僅 ％×1、tab×4），判定為標註時量測條件差異，不硬調。
  v2.0.0：中日文計字改「混合計法」（Ken 依 Word 對照指示）——中日文一字一計、夾雜英數連續串每串 1 字，
          與 Word「字數」同語意（實測 IoT PPTX 混合計法 371 vs Word 368，差異為 PDF→Word 轉檔損耗）；
          英文檔單字計法不變；內部保留逐字數供 30,000 字系統上限判斷（技術口徑，不對客戶顯示）。
  wordcount-quote v1.9.0 (2026-08-17)
  v1.9.0：介面精簡（Ken 指示）——移除母片/版面背景圖縮圖（不入圖片數）、向量圖提醒改精簡格式
          （「第5頁×6張。可能含文字，請檢查。」）、移除參考數列/操作提示/參數日期/footer 贅語/
          檔案大小與指紋徽章（指紋仍印在 LINE 報價單）、拖放區改上傳圖示。
  wordcount-quote v1.8.0 (2026-08-17)
  v1.8.0：EMF/WMF/TIFF 向量圖移出縮圖牆，改為頁碼分組警示行（「p.5×4」；常為貼上圖表/公式，提醒開原檔確認）；
          縮圖 84→132px；點縮圖開燈箱看原圖（Esc/點擊關閉）；LINE 報價單加向量圖位置行。
          實驗記錄：EMF 二進位文字抽取在真實檔案（文字已轉曲線）抽不到內容，不採用。
  wordcount-quote v1.7.0 (2026-08-15)
  v1.7.0：圖片縮圖牆——每張圖顯示縮圖＋所在位置（PPTX 第幾頁／XLSX 工作表／DOCX 正文・頁首・頁尾，
          由 rels 關聯解析）；縮圖右上 ✕ 可逐張排除（太小或業主自理），排除數與剩餘數同步進 LINE 報價單；
          EMF/WMF/TIFF 標「無預覽」。計數邏輯不變（回歸 ±0）。
  v1.6.0：用語全面市場化（Ken 指示）——台灣翻譯報價只講「字／文字數」：中日文一個文字＝1 字、
          英文一個單字＝1 字。移除全部工程用語，UI/報價單/規則零出現；計數邏輯不變（回歸 ±0）。
  v1.5.0：全面「元／字」計價；金額先捨入到分再進位到元（防浮點誤差）；舊參數自動遷移（÷1000）。
  v1.4.0：計價單位雙軌初版（英文單字模式、自動語言判斷、每檔切換）。
  v1.3.0：「有印為憑」視覺改版（design-plan-v1.3.md）——墨紙朱 tokens、卡通計算機朱印 LOGO（Claude v2 定稿）、
          報價單據化＋蓋章動效、全站文字精簡。計數引擎與 v1.0.0-v1.2.0 完全相同（回歸驗證見下）。
  v1.2.0：圖片偵測提醒；v1.1.0：公平規則面板＋範圍調整＋折讓；v1.0.0：核心計數與報價

    F1 真實 PPTX 31,109／F2 DOCX 156／F3 XLSX 108／F4 PPTX 154／研修手帳 703——全部 ±0
    ＊僅代表驗證檔案結果，非全輸入認證；正式扣點以翻譯系統計數為準

<style>
:root{
  --paper:#FAF9F6;--card:#FFFFFF;--ink:#1C1C1E;--ink-soft:#6E6E73;
  --seal:#C0392B;--seal-soft:#C0392B14;--line:#E8E6E1;--gold:#8A7B5C;
  --mono:Consolas,"Courier New",monospace;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.7 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
.num,td.num,th.num,.hero-n,.badge{font-variant-numeric:tabular-nums}
.wrap{max-width:860px;margin:0 auto;padding:28px 20px 72px}

/* ── 頂欄 ── */
.top{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.top .logo{width:40px;height:40px;color:var(--seal);flex:none}
.top h1{font-size:19px;margin:0;letter-spacing:.06em}
.top .ver{font-size:11.5px;color:var(--ink-soft);margin-left:2px}
.top .rules-link{margin-left:auto;font-size:12.5px;color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--line)}
.top .rules-link:hover{color:var(--seal);border-color:var(--seal)}

/* ── 投遞區 ── */
#drop{border:1.5px dashed #C9C4BA;border-radius:14px;padding:48px 24px;text-align:center;background:var(--card);cursor:pointer;transition:border-color .15s,background .15s;box-shadow:var(--shadow)}
#drop.on,#drop:hover{border-color:var(--seal);background:#FFFDFB}
#drop .upic{width:56px;height:56px;color:var(--seal);display:block;margin:0 auto}
#drop .f{font-size:12px;color:var(--ink-soft);margin-top:10px;letter-spacing:.2em}

/* ── 檔案卡 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;margin-top:20px;box-shadow:var(--shadow);animation:fadeUp .2s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fname{font-weight:700;font-size:16px;word-break:break-all}
.badge{font-family:var(--mono);font-size:11px;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
.badge.err{color:var(--seal);border-color:var(--seal)}
.cardx{margin-left:auto;align-self:center;flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink-soft);font-size:13px;line-height:1;padding:0;cursor:pointer;transition:color .15s,border-color .15s}
.cardx:hover{color:var(--seal);border-color:var(--seal)}
.banner .verlink{color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px}
.hero{display:flex;align-items:flex-end;gap:14px;margin:16px 0 4px;flex-wrap:wrap}
.hero-n{font-size:34px;font-weight:700;color:var(--seal);line-height:1}
.hero-l{font-size:12px;color:var(--ink-soft);padding-bottom:3px}
.refline{font-size:12.5px;color:var(--ink-soft);margin:6px 0 12px}
.refline i{font-style:normal;border-bottom:1px dotted var(--ink-soft);cursor:help}
.banner{border-radius:9px;padding:7px 12px;font-size:13px;margin:8px 0;background:var(--seal-soft);color:var(--seal)}
.banner.soft{color:#8a5a00;background:#F5EDE0}
.banner details{display:inline}
.banner summary{display:inline;cursor:pointer;text-decoration:underline}
.banner .ilist{font-family:var(--mono);font-size:11px;margin-top:4px;color:var(--ink-soft)}
.imgrid{display:flex;flex-wrap:wrap;gap:16px;margin:10px 0 4px}
.imcell{position:relative;width:132px}
.imcell img{width:132px;height:132px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#fff;display:block;cursor:zoom-in}
.imcell.off img{opacity:.3;filter:grayscale(1)}
.imcell.off .impg{opacity:.4}
.imx{position:absolute;top:-8px;right:-8px;width:23px;height:23px;border-radius:50%;background:var(--seal);color:#fff;border:2px solid #fff;font-size:12px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.imx:hover{filter:brightness(1.1)}
.impg{display:block;font-size:11px;color:var(--ink-soft);font-family:var(--mono);text-align:center;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lightbox{position:fixed;inset:0;background:rgba(20,20,22,.82);display:none;align-items:center;justify-content:center;z-index:99;cursor:zoom-out}
#lightbox.on{display:flex}
#lightbox img{max-width:92vw;max-height:92vh;border-radius:8px;background:#fff;box-shadow:0 12px 48px rgba(0,0,0,.5)}
table{border-collapse:collapse;width:100%;font-size:13px;margin:10px 0 4px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left}
th{color:var(--ink-soft);font-weight:600;font-size:11.5px;letter-spacing:.05em}
td.num,th.num{text-align:right;font-family:var(--mono);font-size:12.5px}
tr.off td{color:#A9A29A;text-decoration:line-through}
tr.off td:first-child{text-decoration:none}
.hint{font-size:11.5px;color:var(--ink-soft)}
.samp{font-size:12px;color:var(--ink-soft);background:#F4F2EE;border-radius:8px;padding:7px 12px;margin-top:10px;word-break:break-all}
input.pinc{accent-color:var(--seal);cursor:pointer;width:14px;height:14px}
.unitseg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-left:auto}
button.useg{background:transparent;color:var(--ink-soft);border:0;border-radius:0;padding:2px 12px;font-size:11.5px;font-weight:600;cursor:pointer}
button.useg.on{background:var(--seal);color:#fff}
button.useg:hover{filter:none}

/* ── 報價單據 ── */
.quote{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;margin-top:26px;box-shadow:var(--shadow);border-top:3px double #C9C4BA}
.quote>b{font-size:16px;letter-spacing:.4em}
.qrow{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:12px}
.qrow label{font-size:11.5px;color:var(--ink-soft);display:block;margin-bottom:3px}
.qrow input{width:128px;padding:7px 10px;border:1px solid #C9C4BA;border-radius:9px;font:inherit;background:var(--paper)}
.qrow input:focus{outline:none;border-color:var(--seal)}
.saved{font-size:11.5px;color:var(--ink-soft);margin-top:8px}
button{background:var(--seal);color:#fff;border:0;border-radius:10px;padding:9px 20px;font:inherit;font-weight:600;cursor:pointer}
button:hover{filter:brightness(1.07)}
button.sec{background:transparent;color:var(--ink);border:1px solid #C9C4BA}
button.sec:hover{border-color:var(--ink);filter:none}
button:disabled{opacity:.4;cursor:not-allowed;filter:none}
#total{font-size:19px;font-weight:700;margin:14px 0 4px;padding-top:12px;border-top:2px solid var(--ink);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#total .err{font-size:13.5px;font-weight:400}
.stamp{width:44px;height:44px;color:var(--seal);flex:none}
.stamp.play{animation:stampIn .35s ease-out}
@keyframes stampIn{0%{opacity:0;transform:scale(1.15) rotate(-3deg)}60%{opacity:1;transform:scale(.98) rotate(0)}100%{opacity:1;transform:none}}
#lineout{white-space:pre-wrap;font-family:var(--mono);font-size:12.5px;background:#F4F2EE;border-radius:9px;padding:14px;margin-top:12px;display:none}

/* ── 規則摺頁 ── */
details.rules{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 22px;margin-top:26px;box-shadow:var(--shadow)}
details.rules summary{cursor:pointer;font-weight:700;font-size:14px;letter-spacing:.05em}
.rulesbody{font-size:13.5px;margin-top:10px}
.rulesbody ol{padding-left:20px;margin:8px 0}
.rulesbody li{margin-bottom:7px}
.excnote{font-size:12px;color:var(--seal);margin-top:6px}
.err{color:var(--seal)}
footer{margin-top:30px;font-size:11.5px;color:var(--ink-soft);text-align:center}
.tag{display:inline-block;font-size:10.5px;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle;background:var(--seal-soft);color:var(--seal)}

@media(max-width:640px){
  .wrap{padding:18px 12px 56px}
  .hero-n{font-size:30px}
  .qrow input{width:110px}
  button{width:100%;margin-top:4px}
  .qrow>div:has(button){flex:1 1 100%}
  table{display:block;overflow-x:auto;white-space:nowrap}
}
</style>
</head>

<div class="wrap">

<div class="top">
  <svg class="logo"><use href="#logoSym"/></svg>
  <h1>字數報價・英文</h1><span class="ver">v1.3.0</span>
  <a class="rules-link" href="#rules">說明</a>
</div>

<div id="drop"><svg class="upic" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M32 40V12M20 24l12-12 12 12"/><path d="M10 44v6a4 4 0 0 0 4 4h36a4 4 0 0 0 4-4v-6"/></svg><div class="f">DOCX・PPTX・XLSX</div></div>
<input type="file" id="fi" multiple accept=".docx,.pptx,.xlsx" style="display:none">

<div class="quote" id="quotebox" style="display:none">
  <b>報　價</b>
  <div class="qrow">
    <div><label>單價（元／字）</label><input id="rate" inputmode="decimal" placeholder="例：1.5"></div>
    <div><label>單檔低消（元）</label><input id="minfee" inputmode="numeric" value="0"></div>
    <div><label>有效天數</label><input id="days" inputmode="numeric" value="14"></div>
  </div>
  <div class="qrow">
    <div><label>折讓（元）</label><input id="disc" inputmode="numeric" value="0" placeholder="字數不打折"></div>
    <div style="flex:1;min-width:180px"><label>折讓原因（印在報價單上）</label><input id="discreason" style="width:100%" placeholder="例：內容大量重複／長期合作"></div>
    <div><button id="calc">計算報價</button></div>
    <div><button class="sec" id="copyline" disabled>複製 LINE 報價</button></div>
    <div><button class="sec" id="copyhand" disabled title="貼到「報價製作表」專案，自動填成報價單">複製報價交接碼</button></div>
  </div>
  <div id="qtable"></div>
  <div id="total"></div>
  <div id="lineout"></div>
</div>

<details class="rules" id="rules"><summary>📖 說明</summary>
<div class="rulesbody">
<b>只收要翻譯的字。</b>
<ol>
<li><b>計數</b>：<b>一個單字＝1 字</b>（以空白分隔）；空白不計。與 Word 字數一致。</li>
<li><b>不計</b>：純數字、符號、試算表重複文字；頁首頁尾預設不計（可勾回）。</li>
<li><b>與 Word 不同</b>：Word 漏算 SmartArt 與圖表文字，本工具會算。</li>
<li><b>圖片文字</b>：不自動計數，需要時事前另外報價。</li>
<li><b>優惠</b>：不用翻的部分可排除；折扣以金額折讓，字數不變。</li>
<li><b>低消與版本</b>：單檔未達低消以低消計；檔案更新需重新計數。</li>
</ol>
</div></details>

<footer>離線計算工具，不上網</footer>

<script>
"use strict";
/* 本檔為單一語言鎖定版：英文 原文專用（Ken 指示分語言獨立校準）。引擎基底＝combined v2.0.1。 */
const LANG={code:"en",name:"英文",unit:"word"};
/* 三個語言版本同批建置的兄弟檔名（同資料夾相對連結） */
const SIBLINGS={zh:{file:"字數報價-中文-v1.3.0.html",name:"中文"},ja:{file:"字數報價-日文-v1.3.0.html",name:"日文"},en:{file:"字數報價-英文-v1.3.0.html",name:"英文"},ko:{file:"字數報價-韓文-v1.3.0.html",name:"韓文"}};
/* ===== 計數核心（SpeedCAT 口徑近似） ===== */
const NB=/[\p{White_Space}\p{Cc}\p{Default_Ignorable_Code_Point}]/u;
const HAS_L=/\p{L}/u;
const NS_A="http://schemas.openxmlformats.org/drawingml/2006/main";
function countBillable(s){let n=0;for(const cp of (s||"").normalize("NFC")){if(!NB.test(cp))n++}return n}
function gate(plain){const t=(plain||"").replace(/\s+/g," ").trim();return t&&HAS_L.test(t)}
/* SpeedCAT parity：通過 gate 的段落內，每個字面 { 因 parser 的 U+E000 sentinel 多計 1 點（契約 A4） */
function gatedBill(txt){return countBillable(txt)+((txt.match(/\{/g)||[]).length)}
/* v1.4：單字數（空白切分）與 CJK 文字數——僅供英文計價與自動計法判斷，不影響逐字計數 */
function wc(t){const s=(t||"").trim();return s?s.split(/\s+/).length:0}
function cjkc(t){return ((t||"").match(/[぀-ヿㇰ-ㇿ㐀-䶿一-鿿豈-﫿가-힯]/g)||[]).length}
/* v2.0：中日文市場計字（混合計法）——中日文一字一計；夾雜的英數連續串（ESP32、100MHz、Wi-Fi）每串＝1 字。
   與 Word「字數」同語意（實測 IoT 檔 371 vs Word 368）。內部另保留逐字數（bill）供 30,000 字系統上限判斷。 */
function ziCount(s){
  const t=(s||"").normalize("NFC");let n=0,i=0;const arr=[...t];
  const isAl=c=>/[A-Za-z0-9]/.test(c), isConn=c=>/[.\-_\/+%#&@:]/.test(c);
  while(i<arr.length){const c=arr[i];
    if(NB.test(c)){i++;continue}
    if(isAl(c)){n++;i++;while(i<arr.length&&(isAl(arr[i])||(isConn(arr[i])&&i+1<arr.length&&isAl(arr[i+1]))))i++}
    else{n++;i++}}
  return n;
}
function kanac(t){return ((t||"").match(/[぀-ゟ゠-ヿㇰ-ㇿ]/g)||[]).length}
/* v1.2.0：韓文字母數（音節＋相容字母＋字母區）——僅供語言不符判斷，不影響計數 */
function hangc(t){return ((t||"").match(/[가-힯ᄀ-ᇿ㄰-㆏]/g)||[]).length}
function addUnit(o,txt){o.bill+=gatedBill(txt);o.segs++;o.words+=wc(txt);o.cjk+=cjkc(txt);o.zi+=ziCount(txt);o.kana+=kanac(txt);o.hang+=hangc(txt)}
function newPart(){return{bill:0,raw:0,segs:0,words:0,cjk:0,zi:0,kana:0,hang:0}}
const FUSE=30000, NEAR=27000;
const FORMULA_ID="quote-v1-ceil-perfile-min-twd";

function parseXml(str){const d=new DOMParser().parseFromString(str,"application/xml");if(d.getElementsByTagName("parsererror").length)throw new Error("XML 解析失敗");return d}
function locals(root,name){const out=[];const it=root.getElementsByTagName("*");for(let i=0;i<it.length;i++){if(it[i].localName===name)out.push(it[i])}return out}
function inSet(node,set){for(let n=node;n;n=n.parentNode){if(set.has(n))return true}return false}

/* AlternateContent：PPTX＝Choice 優先、Choice 無 a:t 才用 Fallback；DOCX＝只取 Choice */
function buildExcluded(doc,mode){
  const ex=new Set();
  for(const ac of locals(doc,"AlternateContent")){
    const choice=[...ac.childNodes].find(n=>n.localName==="Choice");
    const fb=[...ac.childNodes].find(n=>n.localName==="Fallback");
    if(mode==="pptx"&&choice&&fb){
      const choiceHasText=locals(choice,"t").some(t=>(t.textContent||"").trim());
      if(choiceHasText)ex.add(fb);else ex.add(choice);
    }else if(fb){ex.add(fb)}
  }
  return ex;
}
/* 段落文字（含 a:fld 內 a:t）＋欄位規則（DOCX） */
function paraTextA(p,ex){let s="";for(const t of locals(p,"t")){if(!inSet(t,ex))s+=t.textContent||""}return s}
function paraTextW(p,ex){
  let s="",stack=[];
  const walk=n=>{
    if(n.nodeType!==1||inSet(n,ex))return;
    const ln=n.localName;
    if(ln==="fldSimple")return;
    if(ln==="fldChar"){const ty=n.getAttribute("w:fldCharType")||n.getAttributeNS(n.namespaceURI,"fldCharType")||[...n.attributes].find(a=>a.localName==="fldCharType")?.value;
      if(ty==="begin")stack.push(true);else if(ty==="separate"){if(stack.length)stack[stack.length-1]=false}else if(ty==="end")stack.pop();return}
    if(ln==="instrText"||ln==="del"||ln==="delText")return;
    if(ln==="drawing"||ln==="pict"||ln==="txbxContent")return; /* 文字方塊由其內層 w:p 自行計，避免雙算 */
    if(ln==="t"){if(!stack.some(v=>v))s+=n.textContent||"";return}
    for(const c of n.childNodes)walk(c);
  };
  for(const c of p.childNodes)walk(c);
  return s;
}
/* 段落集合 → gated billable（每段一 gate，模擬 segment 准入） */
function countParas(paras,texter,ex){const o=newPart();o.samples=[];
  for(const p of paras){const txt=texter(p,ex);o.raw+=countBillable(txt);
    if(gate(txt)){addUnit(o,txt);if(o.samples.length<3&&txt.trim())o.samples.push(txt.trim().slice(0,80))}}
  return o}

/* ===== PPTX ===== */
async function analyzePptx(zip){
  const parts={}, samples=[];
  const names=Object.keys(zip.files);
  const get=async p=>parseXml(await zip.file(p).async("string"));
  const sel=re=>names.filter(n=>re.test(n)).sort();
  const merge=(a,r)=>{a.bill+=r.bill;a.raw+=r.raw;a.segs+=r.segs;a.words+=r.words;a.cjk+=r.cjk;a.zi+=r.zi;a.kana+=r.kana;a.hang+=r.hang};
  let slide=newPart(), slideCount=0;
  for(const p of sel(/^ppt\/slides\/slide\d+\.xml$/)){slideCount++;
    const d=await get(p),ex=buildExcluded(d,"pptx");
    const r=countParas(locals(d,"p").filter(x=>x.namespaceURI&&x.localName==="p"&&x.parentNode),paraTextA,ex);
    merge(slide,r);if(samples.length<3)samples.push(...r.samples.slice(0,3-samples.length));
  }
  parts["投影片正文（含表格）"]=slide;
  let notes=newPart();
  for(const p of sel(/^ppt\/notesSlides\/notesSlide\d+\.xml$/)){
    const d=await get(p),ex=buildExcluded(d,"pptx");
    merge(notes,countParas(locals(d,"p"),paraTextA,ex));
  }
  parts["講者備註"]=notes;
  let cc=newPart(),cr=newPart();
  for(const p of sel(/^ppt\/charts\/chart\d+\.xml$/)){
    const d=await get(p);
    const seen=new Map();
    for(const cache of locals(d,"strCache")){for(const v of locals(cache,"v")){const t=v.textContent||"";cc.raw+=countBillable(t);if(!seen.has(t))seen.set(t,true)}}
    for(const[t]of seen){if(gate(t))addUnit(cc,t)}
    for(const rich of locals(d,"rich")){const r=countParas(locals(rich,"p"),paraTextA,new Set());cr.bill+=r.bill;cr.raw+=r.raw;cr.segs+=r.segs;cr.words+=r.words;cr.cjk+=r.cjk;cr.zi+=r.zi;cr.kana+=r.kana;cr.hang+=r.hang}
  }
  for(const p of sel(/^ppt\/drawings\/drawing\d+\.xml$/)){
    const d=await get(p);const r=countParas(locals(d,"p"),paraTextA,new Set());cr.bill+=r.bill;cr.raw+=r.raw;cr.segs+=r.segs;cr.words+=r.words;cr.cjk+=r.cjk;cr.zi+=r.zi;cr.kana+=r.kana;cr.hang+=r.hang;
  }
  parts["圖表快取（系列／類別名）"]=cc;
  parts["圖表文字與註記"]=cr;
  let sa=newPart();
  for(const p of sel(/^ppt\/diagrams\/data\d*\.xml$/)){
    const d=await get(p);
    for(const pt of locals(d,"pt")){const ty=[...pt.attributes].find(a=>a.localName==="type")?.value;
      if(["doc","pres","parTrans","sibTrans"].includes(ty))continue;
      const txt=locals(pt,"t").filter(t=>t.namespaceURI===NS_A).map(t=>t.textContent||"").join("");sa.raw+=countBillable(txt);
      if(gate(txt))addUnit(sa,txt)}
  }
  parts["SmartArt"]=sa;
  return{parts,samples,extra:{slideCount}};
}
/* ===== DOCX ===== */
async function analyzeDocx(zip){
  const parts={},samples=[];const names=Object.keys(zip.files);
  const get=async p=>parseXml(await zip.file(p).async("string"));
  const sel=re=>names.filter(n=>re.test(n)).sort();
  const doPart=async(p)=>{const d=await get(p),ex=buildExcluded(d,"docx");
    for(const fn of locals(d,"footnote").concat(locals(d,"endnote"))){
      const ty=[...fn.attributes].find(a=>a.localName==="type")?.value;
      if(ty==="separator"||ty==="continuationSeparator")ex.add(fn);
    }
    return countParas(locals(d,"p").filter(x=>x.localName==="p"),paraTextW,ex)};
  const body=await doPart("word/document.xml");samples.push(...body.samples);
  parts["正文（含表格、文字方塊）"]=body;
  const acc=async(re,label)=>{let a=newPart();for(const p of sel(re)){const r=await doPart(p);a.bill+=r.bill;a.raw+=r.raw;a.segs+=r.segs;a.words+=r.words;a.cjk+=r.cjk;a.zi+=r.zi;a.kana+=r.kana;a.hang+=r.hang}parts[label]=a};
  await acc(/^word\/header\d+\.xml$/,"頁首");
  await acc(/^word\/footer\d+\.xml$/,"頁尾");
  await acc(/^word\/footnotes\.xml$/,"註腳");
  await acc(/^word\/endnotes\.xml$/,"章末注");
  await acc(/^word\/comments\.xml$/,"註解");
  let sa=newPart();
  for(const p of sel(/^word\/diagrams\/data\d*\.xml$/)){
    const d=await get(p);
    for(const pt of locals(d,"pt")){const ty=[...pt.attributes].find(a=>a.localName==="type")?.value;
      if(["doc","pres","parTrans","sibTrans"].includes(ty))continue;
      const txt=locals(pt,"t").filter(t=>t.namespaceURI===NS_A).map(t=>t.textContent||"").join("");sa.raw+=countBillable(txt);
      if(gate(txt))addUnit(sa,txt)}
  }
  parts["SmartArt"]=sa;
  let cc=newPart(),cr=newPart();
  for(const p of sel(/^word\/charts\/chart\d*\.xml$/)){
    const d=await get(p);const seen=new Map();
    for(const cache of locals(d,"strCache")){for(const v of locals(cache,"v")){const t=v.textContent||"";cc.raw+=countBillable(t);if(!seen.has(t))seen.set(t,true)}}
    for(const[t]of seen){if(gate(t))addUnit(cc,t)}
    for(const rich of locals(d,"rich")){const r=countParas(locals(rich,"p"),paraTextA,new Set());cr.bill+=r.bill;cr.raw+=r.raw;cr.segs+=r.segs;cr.words+=r.words;cr.cjk+=r.cjk;cr.zi+=r.zi;cr.kana+=r.kana;cr.hang+=r.hang}
  }
  parts["圖表快取"]=cc;parts["圖表文字"]=cr;
  return{parts,samples,extra:{}};
}
/* ===== XLSX ===== */
async function analyzeXlsx(zip){
  const parts={},samples=[];const names=Object.keys(zip.files);
  const get=async p=>parseXml(await zip.file(p).async("string"));
  const sel=re=>names.filter(n=>re.test(n)).sort();
  const protectedSi=new Set();
  for(const p of sel(/^xl\/worksheets\/sheet\d+\.xml$/)){
    const d=await get(p);
    for(const c of locals(d,"c")){
      if(c.getAttribute("t")==="s"&&locals(c,"f").length){const v=locals(c,"v")[0];const i=v?parseInt(v.textContent,10):NaN;if(!isNaN(i))protectedSi.add(i)}
    }
  }
  let ss=newPart();
  if(zip.file("xl/sharedStrings.xml")){
    const d=await get("xl/sharedStrings.xml");
    const items=locals(d,"si");
    items.forEach((si,i)=>{
      const txt=locals(si,"t").map(t=>t.textContent||"").join("");
      ss.raw+=countBillable(txt);
      if(protectedSi.has(i))return;
      if(gate(txt)){addUnit(ss,txt);if(samples.length<3&&txt.trim())samples.push(txt.trim().slice(0,80))}
    });
  }
  parts["共用字串（唯一值；含注音）"]=ss;
  let is=newPart();
  for(const p of sel(/^xl\/worksheets\/sheet\d+\.xml$/)){
    const d=await get(p);
    for(const cell of locals(d,"is")){const txt=locals(cell,"t").map(t=>t.textContent||"").join("");is.raw+=countBillable(txt);if(gate(txt))addUnit(is,txt)}
  }
  parts["行內字串"]=is;
  let cm=newPart();
  for(const p of sel(/^xl\/comments\d*\.xml$/)){
    const d=await get(p);
    for(const c of locals(d,"comment")){const txt=locals(c,"t").map(t=>t.textContent||"").join("");cm.raw+=countBillable(txt);if(gate(txt))addUnit(cm,txt)}
  }
  parts["儲存格批注"]=cm;
  let dr=newPart();
  for(const p of sel(/^xl\/drawings\/drawing\d+\.xml$/)){
    const d=await get(p);const r=countParas(locals(d,"p"),paraTextA,new Set());dr.bill+=r.bill;dr.raw+=r.raw;dr.segs+=r.segs;dr.words+=r.words;dr.cjk+=r.cjk;dr.zi+=r.zi;dr.kana+=r.kana;dr.hang+=r.hang;
  }
  parts["繪圖文字方塊"]=dr;
  return{parts,samples,extra:{}};
}
/* ===== 圖片偵測（不計數、只提醒——說明面板「圖片內的文字」條）＋縮圖與位置對應 ===== */
const IMG_RE=/\.(png|jpe?g|gif|bmp|tiff?|emf|wmf|svgz?|webp)$/i;
const IMG_MIME={png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",bmp:"image/bmp",webp:"image/webp",svg:"image/svg+xml"};/* emf/wmf/tiff/svgz＝瀏覽器無法渲染→向量/無預覽類 */
async function relTargets(zip,relPath){/* 解析 .rels：回傳 media 檔名（去路徑）陣列 */
  const f=zip.file(relPath);if(!f)return[];
  const x=await f.async("string");
  return[...x.matchAll(/Target="([^"]*media\/([^"\/]+))"/g)].map(m=>m[2]);
}
async function collectImages(zip,ext){
  const prefix=ext==="pptx"?"ppt/media/":ext==="docx"?"word/media/":"xl/media/";
  const names=Object.keys(zip.files);
  const list=[];
  const byName=new Map();
  for(const[name,f]of Object.entries(zip.files)){
    if(f.dir||!name.startsWith(prefix)||!IMG_RE.test(name))continue;
    const size=(f._data&&f._data.uncompressedSize)||0;
    const short=name.slice(prefix.length);
    const e=(short.match(/\.([a-z0-9]+)$/i)||[])[1]?.toLowerCase();
    const item={name:short,zipPath:name,size,ext:e,pages:[],excluded:false,url:null};
    list.push(item);byName.set(short,item);
  }
  /* 位置對應 */
  if(ext==="pptx"){
    for(const rp of names.filter(n=>/^ppt\/slides\/_rels\/slide\d+\.xml\.rels$/.test(n))){
      const num=parseInt(rp.match(/slide(\d+)/)[1],10);
      for(const t of await relTargets(zip,rp)){const it=byName.get(t);if(it&&!it.pages.includes("p."+num))it.pages.push("p."+num)}
    }
  }else if(ext==="xlsx"){
    for(const rp of names.filter(n=>/^xl\/worksheets\/_rels\/sheet\d+\.xml\.rels$/.test(n))){
      const num=parseInt(rp.match(/sheet(\d+)/)[1],10);
      const relX=await zip.file(rp).async("string");
      for(const dm of[...relX.matchAll(/Target="[^"]*drawings\/(drawing\d+)\.xml"/g)]){
        for(const t of await relTargets(zip,`xl/drawings/_rels/${dm[1]}.xml.rels`)){const it=byName.get(t);if(it&&!it.pages.includes("表"+num))it.pages.push("表"+num)}
      }
    }
  }else{
    const label=async(rp,lab)=>{for(const t of await relTargets(zip,rp)){const it=byName.get(t);if(it&&!it.pages.includes(lab))it.pages.push(lab)}};
    await label("word/_rels/document.xml.rels","正文");
    for(const rp of names.filter(n=>/^word\/_rels\/header\d+\.xml\.rels$/.test(n)))await label(rp,"頁首");
    for(const rp of names.filter(n=>/^word\/_rels\/footer\d+\.xml\.rels$/.test(n)))await label(rp,"頁尾");
  }
  /* pages 排序（數字自然序）＋縮圖 blob URL（EMF/WMF/TIFF 瀏覽器無法預覽） */
  for(const it of list){
    it.pages.sort((a,b)=>(parseInt(a.replace(/\D/g,""),10)||0)-(parseInt(b.replace(/\D/g,""),10)||0));
    if(!it.pages.length)it.pages=["版面/其他"];
    const mime=IMG_MIME[it.ext];
    it.vector=!mime;
    if(mime){try{const blob=await zip.file(it.zipPath).async("blob");it.url=URL.createObjectURL(new Blob([blob],{type:mime}))}catch(e){it.vector=true}}
  }
  list.sort((a,b)=>b.size-a.size);
  return{count:list.length,bytes:list.reduce((a,x)=>a+x.size,0),list};
}
function isLayoutImg(x){return x.pages.length===1&&x.pages[0]==="版面/其他"}
function includedImages(r){return r.images?r.images.list.filter(x=>!x.vector&&!isLayoutImg(x)&&!x.excluded):[]}
function vectorImages(r){return r.images?r.images.list.filter(x=>x.vector):[]}
function pageGroupsZh(list){/* ["p.5"×6] → "第5頁×6張" */
  const m=new Map();for(const x of list)for(const p of x.pages)m.set(p,(m.get(p)||0)+1);
  const zh=p=>{const s=p.match(/^p\.(\d+)$/);if(s)return`第${s[1]}頁`;const t=p.match(/^表(\d+)$/);if(t)return`工作表${t[1]}`;return p};
  return[...m.entries()].sort((a,b)=>(parseInt(a[0].replace(/\D/g,""),10)||999)-(parseInt(b[0].replace(/\D/g,""),10)||999))
    .map(([p,n])=>`${zh(p)}×${n}張`).join("、");
}
/* ===== metadata Words ===== */
async function metaWords(zip){
  try{const f=zip.file("docProps/app.xml");if(!f)return null;
    const d=parseXml(await f.async("string"));const w=locals(d,"Words")[0];return w?parseInt(w.textContent,10):null;
  }catch(e){return null}
}
/* ===== 主流程 ===== */
const results=[];window.__results=results;
/* 卡片移除：事件委派——分析中/錯誤/重複卡（無 __r）也適用；移除後同步報價 */
document.getElementById("cards").addEventListener("click",e=>{
  const b=e.target.closest("button.cardx");if(!b)return;
  const card=b.closest(".card");if(!card)return;
  const r=card.__r;
  if(r){const i=results.indexOf(r);if(i>=0)results.splice(i,1);
    if(r.images&&r.images.list)for(const x of r.images.list){if(x.url)try{URL.revokeObjectURL(x.url)}catch(_){}}}
  card.remove();
  if(results.length===0){
    document.getElementById("quotebox").style.display="none";
    document.getElementById("qtable").innerHTML="";document.getElementById("total").innerHTML="";
    setCopyBtns(true);
    lastQuote=null;
  }else if(lastQuote)calc(true);
});
async function sha256hex(buf){
  try{const h=await crypto.subtle.digest("SHA-256",buf);return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("")}
  catch(e){return null}
}
async function handleFile(file){
  const card=document.createElement("div");card.className="card";
  card.innerHTML=`<div class="fhead"><span class="fname">${esc(file.name)}</span><span class="badge">分析中…</span><button class="cardx" title="移除此檔">✕</button></div>`;
  document.getElementById("cards").appendChild(card);
  try{
    const ext=(file.name.match(/\.(docx|pptx|xlsx)$/i)||[])[1]?.toLowerCase();
    if(!ext)throw new Error("僅支援 .docx / .pptx / .xlsx");
    const buf=await file.arrayBuffer();
    const sha=await sha256hex(buf);
    if(sha&&results.some(r=>r.sha===sha)){card.innerHTML=`<div class="fhead"><span class="fname">${esc(file.name)}</span><span class="badge err">內容重複，已略過</span><button class="cardx" title="移除此檔">✕</button></div>`;return}
    let zip;try{zip=await JSZip.loadAsync(buf)}catch(e){throw new Error("無法解壓——檔案損壞或已加密")}
    const fn=ext==="pptx"?analyzePptx:ext==="docx"?analyzeDocx:analyzeXlsx;
    const{parts,samples,extra}=await fn(zip);
    const meta=await metaWords(zip);
    const images=await collectImages(zip,ext);
    const bill=Object.values(parts).reduce((a,p)=>a+p.bill,0);
    const raw=Object.values(parts).reduce((a,p)=>a+p.raw,0);
    const words=Object.values(parts).reduce((a,p)=>a+(p.words||0),0);
    const cjk=Object.values(parts).reduce((a,p)=>a+(p.cjk||0),0);
    const unit=LANG.unit; /* 鎖定版：計法由語言版本決定，不自動判斷 */
    const r={name:file.name,size:file.size,sha,sha8:sha?sha.slice(0,8):"（無法計算）",bill,raw,words,cjk,unit,parts,meta,extra,images,warnings:[],_samples:samples||[],excluded:new Set()};
    /* 語言不符警告＋建議版本：中日文版遇幾乎無 CJK→英文版；英文版遇大量 CJK→依假名有無判日/中；
       中文版遇假名占 CJK >5%→日文版。日文版遇純漢字不提示（日文名詞清單類檔可能零假名，誤報風險高，且中日計法相同） */
    if(bill>0){const ratio=cjk/bill;
      const kana=Object.values(parts).reduce((a,p)=>a+(p.kana||0),0);
      const hang=Object.values(parts).reduce((a,p)=>a+(p.hang||0),0);
      const koish=cjk>0&&hang/cjk>0.3; /* v1.2.0：韓文字母占 CJK >30%＝韓文檔 */
      if(LANG.unit==="char"&&ratio<0.1){r.warnings.push("langmis");r.suggest="en"}
      else if(LANG.unit==="word"&&ratio>0.3){r.warnings.push("langmis");r.suggest=koish?"ko":kana>0?"ja":"zh"}
      else if(LANG.code!=="ko"&&koish){r.warnings.push("langmis");r.suggest="ko"}
      else if(LANG.code==="ko"&&cjk>0&&!koish){r.warnings.push("langmis");r.suggest=kana>0?"ja":"zh"}
      else if(LANG.code==="zh"&&cjk>0&&kana/cjk>0.05){r.warnings.push("langmis");r.suggest="ja"}}
    /* v2.0.1：DOCX 頁首/頁尾預設不入報價（Word 字數統計不含它們；多為頁碼與模板出處。需翻譯時勾回即可） */
    if(ext==="docx")for(const k of["頁首","頁尾"]){if(parts[k]&&parts[k].bill>0)r.excluded.add(k)}
    if(bill===0)r.warnings.push("zero");
    else if(bill>FUSE)r.warnings.push("over");
    else if(bill>=NEAR)r.warnings.push("near");
    results.push(r);
    renderCard(card,r,true);
    document.getElementById("quotebox").style.display="block";
  }catch(e){
    card.innerHTML=`<div class="fhead"><span class="fname">${esc(file.name)}</span><span class="badge err">✗ ${esc(e.message||String(e))}</span><button class="cardx" title="移除此檔">✕</button></div>`;
  }
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmt(n){return n.toLocaleString("zh-Hant")}
/* 報價範圍內的計費字數（量測 r.bill 不變；排除只影響報價） */
function billActive(r){let n=0;for(const[k,p]of Object.entries(r.parts)){if(!r.excluded.has(k))n+=p.bill}return n}
function wordActive(r){let n=0;for(const[k,p]of Object.entries(r.parts)){if(!r.excluded.has(k))n+=(p.words||0)}return n}
function ziActive(r){let n=0;for(const[k,p]of Object.entries(r.parts)){if(!r.excluded.has(k))n+=(p.zi||0)}return n}
function excludedSummary(r){const isW=r.unit==="word";const out=[];for(const k of r.excluded){const p=r.parts[k];if(p&&p.bill>0)out.push(`${k} ${fmt(isW?(p.words||0):(p.zi||0))} 字`)}return out}
function countUpEl(el,target){
  const t0=performance.now(),dur=400;
  const step=now=>{const k=Math.min(1,(now-t0)/dur);el.textContent=fmt(Math.round(target*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
  setTimeout(()=>{el.textContent=fmt(target)},dur+80); /* rAF 被節流時的保底：最終值必落定 */
}
function renderCard(card,r,first){
  const act=billActive(r), excl=excludedSummary(r);
  const mb=r.images&&r.images.bytes?(r.images.bytes/1048576).toFixed(1):0;
  const wact=wordActive(r), zact=ziActive(r), isWord=r.unit==="word";
  let h=`<div class="fhead"><span class="fname">${esc(r.name)}</span><button class="cardx" title="移除此檔">✕</button></div>
  <div class="hero"><span class="hero-n num" id="hn">${fmt(isWord?wact:zact)}</span><span class="hero-l">報價字數${isWord?"（以單字計）":"（以文字計；英數字串每串 1 字）"}${excl.length?`　<span class="tag">已調範圍</span>`:""}</span></div>`;
  if(r.warnings.includes("langmis")){const s=SIBLINGS[r.suggest]||SIBLINGS.en;
    h+=`<div class="banner">⚠ 此檔內容與本版本語言（${LANG.name}）不符——請改用 <a class="verlink" href="${encodeURI(s.file)}" target="_blank" rel="noopener">${s.name}版</a>（另開分頁後，把檔案重新拖入）。</div>`;}
  if(excl.length)h+=`<div class="excnote">已排除：${esc(excl.join("、"))}（量測不變）</div>`;
  if(r.warnings.includes("over"))h+=`<div class="banner">⚠ 超過單件上限 30,000——需拆檔（可正常報價，執行另議）</div>`;
  if(r.warnings.includes("near"))h+=`<div class="banner soft">接近單件上限（≥27,000／30,000）</div>`;
  if(r.warnings.includes("zero"))h+=`<div class="banner soft">無可翻譯內容——不產生報價、不套低消</div>`;
  if(r.images&&r.images.count>0){
    const shown=r.images.list.filter(x=>!x.vector&&!isLayoutImg(x)), vecs=vectorImages(r);
    const inc=includedImages(r), excN=shown.length-inc.length;
    if(shown.length){
      h+=`<div class="banner soft">🖼 ${inc.length} 張圖片——圖內文字另計${excN?`（另 ${excN} 張已排除）`:""}</div>
      <div class="imgrid">${r.images.list.map((x,i)=>{
        if(x.vector||isLayoutImg(x))return"";
        const kb=x.size>=1048576?(x.size/1048576).toFixed(1)+" MB":Math.max(1,Math.round(x.size/1024))+" KB";
        return`<div class="imcell${x.excluded?" off":""}" title="${esc(x.name)}｜${kb}｜${esc(x.pages.join("、"))}">
          <img src="${x.url}" alt="" loading="lazy" class="imzoom" data-url="${x.url}">
          <button class="imx" data-i="${i}" title="${x.excluded?"還原此圖":"排除此圖"}">${x.excluded?"↺":"✕"}</button>
          <span class="impg">${esc(x.pages.join("、"))}</span></div>`;
      }).join("")}</div>`;
    }
    if(vecs.length){
      h+=`<div class="banner">⚠ ${vecs.length} 張向量圖無法預覽——位置：${esc(pageGroupsZh(vecs))}。<b>可能含文字</b>，請檢查。</div>`;
    }
  }
  h+=`<table><tr><th></th><th>部位</th><th class="num">字數</th><th class="num">段落</th><th class="num">未過濾</th></tr>`;
  for(const[k,p]of Object.entries(r.parts)){if(p.raw===0&&p.bill===0)continue;
    const off=r.excluded.has(k);
    h+=`<tr${off?' class="off"':''}><td><input type="checkbox" class="pinc" data-part="${esc(k)}" ${off?"":"checked"}></td><td>${esc(k)}</td><td class="num">${fmt(isWord?(p.words||0):(p.zi||0))}</td><td class="num">${fmt(p.segs)}</td><td class="num">${fmt(p.raw)}</td></tr>`}
  h+=`</table><div class="hint">勾選＝納入報價</div>`;
  const samp=(r.extra&&r.extra.slideCount)?`投影片 ${r.extra.slideCount}｜`:"";
  h+=`<div class="samp">${samp}抽樣：${esc((r._samples||[]).join(" ／ ")||"—")}</div>`;
  card.innerHTML=h;
  card.__r=r; /* 供卡片移除（事件委派）反查 results */
  if(first){const hn=card.querySelector("#hn");if(hn)countUpEl(hn,isWord?wact:zact)}
  card.querySelectorAll("input.pinc").forEach(cb=>{
    cb.onchange=()=>{const k=cb.getAttribute("data-part");
      if(cb.checked)r.excluded.delete(k);else r.excluded.add(k);
      renderCard(card,r,false);
      if(lastQuote)calc(true);
    };
  });
  card.querySelectorAll("button.imx").forEach(b=>{
    b.onclick=e=>{e.stopPropagation();const i=+b.getAttribute("data-i");
      r.images.list[i].excluded=!r.images.list[i].excluded;
      renderCard(card,r,false);
    };
  });
  card.querySelectorAll("img.imzoom").forEach(im=>{
    im.onclick=()=>{const lb=document.getElementById("lightbox");lb.querySelector("img").src=im.getAttribute("data-url");lb.classList.add("on")};
  });
}
/* ===== 報價 ===== */
const LS_KEY="wordcount-quote:"+LANG.code+":params:v1";
function loadParams(){try{const p=JSON.parse(localStorage.getItem(LS_KEY));if(p&&p.schemaVersion===1)return p}catch(e){}return null}
function saveParams(rate,minfee,days){localStorage.setItem(LS_KEY,JSON.stringify({schemaVersion:1,rate,minfee,days,savedAt:new Date().toISOString()}))}
function showSaved(){}
let lastQuote=null;
function setCopyBtns(off){for(const id of["copyline","copyhand"]){const b=document.getElementById(id);if(b)b.disabled=off}}
/* 金額＝字數×元/字，先四捨五入到「分」再無條件進位到「元」（防浮點誤差，如 1000×0.1） */
function money(qty,rate){return Math.ceil(Math.round(qty*rate*100)/100)}
window.__money=money;
function calc(silent){
  const rate=parseFloat(document.getElementById("rate").value);
  const minfee=parseInt(document.getElementById("minfee").value,10)||0;
  const days=parseInt(document.getElementById("days").value,10)||14;
  const disc=parseInt(document.getElementById("disc").value,10)||0;
  const discreason=(document.getElementById("discreason").value||"").trim();
  const tbl=document.getElementById("qtable"),tot=document.getElementById("total");
  if(!(rate>0)){tot.innerHTML='<span class="err">請輸入單價（元／字，可小數）——未輸入不出金額。</span>';tbl.innerHTML="";setCopyBtns(true);return}
  if(disc<0){tot.innerHTML='<span class="err">折讓不可為負數。</span>';return}
  saveParams(rate,minfee,days);showSaved();
  let subtotal=0,lines=[];
  let h=`<table><tr><th>檔案</th><th class="num">報價字數</th><th class="num">金額（TWD）</th><th>狀態</th></tr>`;
  for(const r of results){
    const act=billActive(r);
    const isWord=r.unit==="word";
    const qty=isWord?wordActive(r):ziActive(r);
    const exclNote=excludedSummary(r);
    if(act===0){const st=r.bill===0?"無可翻譯內容":"全部部位已排除";
      h+=`<tr><td>${esc(r.name)}</td><td class="num">0</td><td class="num">—</td><td>${st}</td></tr>`;
      lines.push({r,act,qty:0,isWord,amt:null,st,minApplied:false,exclNote});continue}
    const base=money(qty,rate);
    const amt=Math.max(minfee,base);
    const minApplied=amt>base;
    subtotal+=amt;
    const st=(r.warnings.includes("over")?"⚠ 需拆檔":"")+(minApplied?"（低消）":"");
    h+=`<tr><td>${esc(r.name)}${exclNote.length?` <span class="tag">已調範圍</span>`:""}</td><td class="num">${fmt(qty)} 字</td><td class="num">${fmt(amt)}</td><td>${st}</td></tr>`;
    lines.push({r,act,qty,isWord,amt,st:r.warnings.includes("over")?"⚠ 需拆檔":"",minApplied,exclNote});
  }
  h+=`</table>`;
  if(disc>subtotal){tot.innerHTML=`<span class="err">折讓（NT$${fmt(disc)}）不可超過小計（NT$${fmt(subtotal)}）。</span>`;tbl.innerHTML=h;setCopyBtns(true);return}
  const payable=subtotal-disc;
  tbl.innerHTML=h;
  const stamp=`<svg class="stamp${silent?"":" play"}" aria-hidden="true"><use href="#logoSym"/></svg>`;
  tot.innerHTML=(disc>0
    ?`<span>小計 NT$${fmt(subtotal)}　−　折讓 NT$${fmt(disc)}　＝　應付 <span class="num">NT$${fmt(payable)}</span>（未稅）</span>`
    :`<span>總計 <span class="num">NT$${fmt(subtotal)}</span>（未稅）</span>`)+stamp;
  lastQuote={rate,minfee,days,disc,discreason,subtotal,payable,lines,at:new Date()};
  setCopyBtns(false);
  document.getElementById("lineout").style.display="none";
}
function lineText(){
  const q=lastQuote;if(!q)return"";
  const local=t=>{const x=new Date(t.getTime()-t.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};
  const d=q.at, iso=local(d);
  const exp=local(new Date(d.getTime()+q.days*86400000));
  let s=`【翻譯報價單】${iso}\n`;
  for(const{r,qty,amt,st,minApplied,exclNote}of q.lines){
    s+=`▪ ${r.name}\n　${fmt(qty)} 字｜${amt==null?"—":"NT$"+fmt(amt)+(minApplied?"（低消）":"")}${st?"｜"+st:""}｜${r.sha8}\n`;
    if(exclNote&&exclNote.length)s+=`　（雙方議定不含：${exclNote.join("、")}——量測照列、不入報價）\n`;
    const inc=includedImages(r), vecs=vectorImages(r);
    const excN=(r.images?r.images.list.filter(x=>!x.vector&&!isLayoutImg(x)).length:0)-inc.length;
    if(inc.length>0)s+=`　（含 ${inc.length} 張圖片——圖內文字未計入，如需翻譯另行估價${excN?`；另 ${excN} 張雙方議定排除`:""}）\n`;
    else if(excN>0)s+=`　（${excN} 張圖片雙方議定排除，不在報價範圍）\n`;
    if(vecs.length>0)s+=`　（另 ${vecs.length} 張向量圖無法預覽——${pageGroupsZh(vecs)}，可能含文字，請檢查）\n`;
  }
  s+=`──────────\n`;
  if(q.disc>0){
    s+=`小計：NT$${fmt(q.subtotal)}\n讓利折讓：−NT$${fmt(q.disc)}${q.discreason?`（${q.discreason}）`:""}\n合計應付：NT$${fmt(q.payable)}（未稅）\n`;
  }else{
    s+=`合計：NT$${fmt(q.subtotal)}（未稅）\n`;
  }
  s+=`單價 ${LANG.name} NT$${q.rate}／字（${LANG.unit==="word"?"以單字計":"以文字計"}）${q.minfee?`｜單檔低消 NT$${q.minfee}`:""}｜公式 ${FORMULA_ID}\n`;
  s+=`有效期至 ${exp}（${q.days} 天）\n`;
  s+=`＊計數規則：只收實際需翻譯的文字（含圖形／圖表內文字；不含空白與純數字段落）。\n`;
  s+=`＊${LANG.unit==="word"?"以單字數計":"以文字數計"}（不含空白）；圖片內文字不在計數內，需翻譯另行估價。\n`;
  s+=`＊報價以檔案指紋（上列 8 碼）鎖定版本；檔案更新需重新計數。工具 英文版 v1.3.0`;
  return s;
}
document.getElementById("calc").onclick=()=>calc(false);
document.getElementById("copyline").onclick=async()=>{
  const t=lineText();const out=document.getElementById("lineout");
  out.textContent=t;out.style.display="block";
  try{await navigator.clipboard.writeText(t);document.getElementById("copyline").textContent="已複製 ✓";setTimeout(()=>document.getElementById("copyline").textContent="複製 LINE 報價",1500)}catch(e){}
};
/* v1.3.0：報價交接碼——貼到「報價製作表」專案，填筆譯母檔。DATA 行是機器讀的唯一真相來源 */
function handoffText(){
  const q=lastQuote;if(!q)return"";
  const p2=n=>String(n).padStart(2,"0"),d=q.at;
  const at=`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
  const files=q.lines.map((l,i)=>{
    const n=[];
    if(l.amt==null)n.push(l.st);
    if(l.minApplied)n.push("低消");
    if(l.amt!=null&&l.st)n.push(l.st.replace("⚠ ",""));
    if(l.exclNote&&l.exclNote.length)n.push("不含"+l.exclNote.join("、"));
    const inc=includedImages(l.r).length,vec=vectorImages(l.r).length;
    if(inc)n.push(`含 ${inc} 張圖片未計`);
    if(vec)n.push(`${vec} 張向量圖待查`);
    return{no:i+1,name:l.r.name,sha8:l.r.sha8,qty:l.qty,amt:l.amt,note:n.join("；")};
  });
  const qty=files.reduce((a,f)=>a+(f.amt==null?0:f.qty),0);
  const lineAmount=Math.round(Math.round(qty*q.rate*100)/100);
  const adjust=q.subtotal-lineAmount;
  const data={v:1,tool:"wordcount-quote",ver:"v1.3.0",lang:LANG.code,langName:LANG.name,unit:"字",
    rate:q.rate,minfee:q.minfee,days:q.days,at,files,totalQty:qty,subtotal:q.subtotal,
    disc:q.disc,discReason:q.discreason,payable:q.payable,
    fill:{qty,rate:q.rate,lineAmount,adjust,disc:q.disc,discReason:q.discreason,days:q.days}};
  let s=`【字數報價交接碼】請整段貼到「報價製作表」專案\n`;
  s+=`原文 ${LANG.name}｜單價 NT$${q.rate}／字｜單檔低消 NT$${fmt(q.minfee)}｜有效 ${q.days} 天｜${at}\n`;
  for(const f of files)s+=`${f.no}. ${f.name}｜${f.sha8}｜${fmt(f.qty)} 字｜${f.amt==null?"—":"NT$"+fmt(f.amt)}${f.note?"（"+f.note+"）":""}\n`;
  s+=`字數合計 ${fmt(qty)} 字｜小計 NT$${fmt(q.subtotal)}｜折讓 NT$${fmt(q.disc)}${q.discreason?"（"+q.discreason+"）":""}｜合計 NT$${fmt(q.payable)}（未稅）\n`;
  s+=`報價單填法：數量 ${fmt(qty)} × 單價 ${q.rate} ＝ NT$${fmt(lineAmount)}；尾數調整（含單檔低消）${adjust>=0?"+":""}${fmt(adjust)}；折讓 ${fmt(q.disc)}\n`;
  s+=`DATA ${JSON.stringify(data)}\n【交接碼結束】`;
  return s;
}
window.__handoff=handoffText;
document.getElementById("copyhand").onclick=async()=>{
  const t=handoffText();const out=document.getElementById("lineout");
  out.textContent=t;out.style.display="block";
  const b=document.getElementById("copyhand");
  try{await navigator.clipboard.writeText(t);b.textContent="已複製 ✓";setTimeout(()=>b.textContent="複製報價交接碼",1500)}catch(e){}
};
/* ===== 事件 ===== */
const drop=document.getElementById("drop"),fi=document.getElementById("fi");
drop.onclick=()=>fi.click();
fi.onchange=()=>{[...fi.files].forEach(handleFile);fi.value=""};
["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("on")}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("on")}));
drop.addEventListener("drop",e=>{[...e.dataTransfer.files].forEach(handleFile)});
document.getElementById("lightbox").onclick=function(){this.classList.remove("on")};
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("lightbox").classList.remove("on")});
(function init(){const p=loadParams();if(p){document.getElementById("rate").value=p.rate||"";document.getElementById("minfee").value=p.minfee??0;document.getElementById("days").value=p.days||14}showSaved()})();
</script>
